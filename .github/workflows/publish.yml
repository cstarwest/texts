name: Publish

# Production for this repo is https://apps.signalaegis.com/texts/, and that
# host is served by the `signal-site` Pages project in a different repo. This
# repo therefore does not deploy: it verifies, then asks signal-site to
# redeploy, and signal-site rebuilds this repo from source as part of that.
# See docs/DEPLOY.md.
#
# The build and the guards run again here rather than being taken on trust
# from the CI workflow — a redeploy request for a build that does not pass is
# a request to publish a broken page.
#
# Optional secret, to make this automatic:
#   SIGNAL_SITE_DISPATCH_TOKEN — a fine-grained PAT scoped to the signal-site
#   repo with Contents: read and Metadata: read, which is what
#   `repository_dispatch` requires.
#
# Without it this job succeeds and prints how to publish by hand. Failing every
# push over a missing optional secret would just train everyone to ignore red.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: true

env:
  SIGNAL_SITE_REPO: cstarwest/bell-app

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Check the built site
        run: npm run check

      - name: Ask signal-site to redeploy
        env:
          TOKEN: ${{ secrets.SIGNAL_SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::No SIGNAL_SITE_DISPATCH_TOKEN set — nothing published."
            echo "Publish by hand: run the 'Deploy to Cloudflare Pages' workflow"
            echo "in $SIGNAL_SITE_REPO. It rebuilds this repo from main."
            exit 0
          fi

          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$SIGNAL_SITE_REPO/dispatches" \
            -d "{\"event_type\":\"external-app-updated\",\"client_payload\":{\"repo\":\"$GITHUB_REPOSITORY\",\"sha\":\"$GITHUB_SHA\"}}")

          if [ "$code" != "204" ]; then
            echo "::error::repository_dispatch to $SIGNAL_SITE_REPO returned $code"
            cat /tmp/dispatch.out
            exit 1
          fi
          echo "Asked $SIGNAL_SITE_REPO to redeploy."
