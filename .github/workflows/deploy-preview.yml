name: Deploy preview to Cloudflare Pages

# OPTIONAL, and never the production path.
#
# Production is https://apps.signalaegis.com/texts/, which is served by the
# `signal-site` Pages project from a different repo. That project's CI builds
# this repo and copies site/texts/ into its own output — see docs/DEPLOY.md.
#
# A Pages direct upload replaces the target project's ENTIRE file set. Pointing
# this workflow at the project that owns apps.signalaegis.com would therefore
# delete every other app on that host. It deploys to a standalone preview
# project instead, named by PREVIEW_PROJECT in site.config.mjs, so a build can
# be checked on a real *.pages.dev URL before production picks it up.
#
# Setup, once, only if you want the preview:
#   1. npx wrangler login
#      npx wrangler pages project create texts-preview --production-branch main
#      Read the output: if the name is taken, Cloudflare assigns a suffixed
#      *.pages.dev subdomain, and that assigned value is the one to visit.
#   2. Cloudflare dashboard -> My Profile -> API Tokens -> Create Token,
#      template "Edit Cloudflare Workers" (or a custom token with
#      Account -> Cloudflare Pages -> Edit).
#   3. Account Home -> the account ID is in the right-hand sidebar.
#   4. This repo -> Settings -> Secrets and variables -> Actions -> add
#      CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
#
# Manual only, deliberately. Nothing here should publish on a push.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Fail early if the secrets are missing
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to repo secrets first."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      # Never publish a build that failed its own guards.
      - name: Check the built site
        run: npm run check

      # The project name comes from site.config.mjs so it is not repeated here.
      - name: Resolve the deploy target
        run: node scripts/deploy-target.mjs >> "$GITHUB_ENV"

      # site/ carries the generated _redirects and _headers; Pages reads both
      # from the uploaded directory, so routing and cache policy ship with it.
      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.PAGES_OUTDIR }} --project-name=${{ env.PAGES_PROJECT }} --branch=main

      - name: Reminder
        run: |
          echo "Preview only. Production stays at https://$PROD_HOST/texts/"
          echo "and updates when signal-site redeploys."
